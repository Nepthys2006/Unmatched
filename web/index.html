<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Unmatched, the fan-made digital edition">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Unmatched">
  <meta name="apple-touch-fullscreen" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Unmatched</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background: #131417;
      color: #ece6d8;
      -webkit-tap-highlight-color: transparent;
    }
    #flutter_container, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      inset: 0 !important;
    }
    #rotate {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      background: #151a23;
      color: #ece6d8;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <div id="rotate">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d9b45e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px;">
      <rect x="4" y="2" width="16" height="20" rx="2" ry="2" transform="rotate(90 12 12)"/>
      <path d="M12 18h.01"/>
    </svg>
    <div style="font-weight:800;font-size:26px;letter-spacing:0.06em;color:#ece6d8;margin-bottom:8px;">TURN YOUR PHONE</div>
    <div style="font-size:15px;color:#b9b3a5;max-width:300px;line-height:1.45;">Turn your phone sideways: Unmatched is played in landscape.</div>
  </div>

  <script>
    // JS interop helpers for Dart fullscreen handling
    window._agy_navigator_standalone = function() {
      return window.navigator.standalone === true;
    };
    window._agy_webkitRequestFullscreen = function(el) {
      if (!el) return;
      var fn = el.webkitRequestFullscreen || el.requestFullscreen;
      if (fn) fn.call(el);
    };

    (function() {
      function isPhone() {
        var isTouch = window.matchMedia('(pointer: coarse)').matches;
        var shortest = Math.min(window.innerWidth, window.innerHeight);
        return isTouch && shortest < 600;
      }

      function checkOrientation() {
        var overlay = document.getElementById('rotate');
        if (!overlay) return;
        var isPortrait = window.innerHeight > window.innerWidth;
        if (isPhone() && isPortrait) {
          overlay.style.display = 'flex';
        } else {
          overlay.style.display = 'none';
        }
      }

      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', checkOrientation);
      }
      checkOrientation();
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
